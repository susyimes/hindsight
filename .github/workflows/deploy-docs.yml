name: Deploy Docs to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'hindsight-docs/**'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  pages-status:
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.pages.outputs.configured }}
    steps:
      - name: Check whether Pages is configured
        id: pages
        uses: actions/github-script@v8
        with:
          script: |
            try {
              await github.rest.repos.getPages({
                owner: context.repo.owner,
                repo: context.repo.repo,
              });
              core.setOutput('configured', 'true');
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }
              core.notice('Skipping Pages deployment because Pages is not configured for this repository.');
              core.setOutput('configured', 'false');
            }

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # fetch tags so check-released-integrations can see them
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: astral-sh/setup-uv@v7
      - run: npm ci --workspace=hindsight-docs
      - run: uv run generate-llms-full
      - run: npm run build --workspace=hindsight-docs
        env:
          UMAMI_URL: https://analytics.hindsight.vectorize.io
          UMAMI_WEBSITE_ID: ${{ secrets.UMAMI_WEBSITE_ID }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: hindsight-docs/build
  deploy:
    if: needs.pages-status.outputs.configured == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [build, pages-status]
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
